[package]
name = "rust_serv"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
libc = "0.2.190"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
